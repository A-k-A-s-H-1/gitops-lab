
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ci-demo
  template:
    metadata:
      labels:
        app: ci-demo
    spec:
      containers:
        - name: web
          image: ghcr.io/a-k-a-s-h-1/gitops-demo:60fd591d805462dd05881e66f8ec02a3a7bb71d7
          ports:
            - containerPort: 80
