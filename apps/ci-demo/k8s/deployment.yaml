
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ci-demo
  template:
    metadata:
      labels:
        app: ci-demo
    spec:
      containers:
        - name: web
          image: ghcr.io/a-k-a-s-h-1/gitops-demo:1cf101fa611b8293621592737ce7e83a024e8a15
          ports:
            - containerPort: 80
