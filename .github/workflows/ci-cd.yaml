name: Build and Publish GitOps Demo

on:
  push:
    branches:
      - main
    paths:
      - "apps/ci-demo/Dockerfile"
      - "apps/ci-demo/src/**"
      - ".github/workflows/ci-cd.yaml"

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set lowercase image name
        shell: bash
        run: |
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_NAME=ghcr.io/${OWNER}/gitops-demo" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: apps/ci-demo
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Update Kubernetes manifest
        shell: bash
        run: |
          sed -i "s|image: .*|image: ${IMAGE_NAME}:${GITHUB_SHA}|" \
            apps/ci-demo/k8s/deployment.yaml

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/ci-demo/k8s/deployment.yaml
          git diff --cached --quiet && exit 0
          git commit -m "Deploy ci-demo image ${GITHUB_SHA}"
          git push