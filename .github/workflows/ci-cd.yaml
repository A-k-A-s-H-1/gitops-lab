
name: Build and Publish GitOps Demo

on:
  push:
    branches:
      - main
    paths:
      - "apps/ci-demo/Dockerfile"
      - "apps/ci-demo/src/**"
      - ".github/workflows/ci-cd.yaml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gitops-demo" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: apps/ci-demo
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gitops-demo:${{ github.sha }}
